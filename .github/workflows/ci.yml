name: HealthDastaan Admin CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, Typecheck, Unit & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Code Formatting Check
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit & Component Tests
        run: npm run test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://api.healthdastaan.com/v1

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Tests
        run: npm run test:e2e
        env:
          CI: true
          PORT: 3000
          HOSTNAME: 0.0.0.0
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000

      - name: Upload Playwright Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    name: Build Multi-Stage Docker Image
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run / Validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: healthdastaan-admin:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.healthdastaan.com/v1
            NEXT_PUBLIC_API_URL=https://api.healthdastaan.com/v1
