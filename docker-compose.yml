services:
  healthdastaan-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.healthdastaan.com/v1}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.healthdastaan.com/v1}
    image: healthdastaan-admin:latest
    container_name: healthdastaan-admin
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-3001}:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://api.healthdastaan.com/v1}
      - INTERNAL_API_BASE_URL=${INTERNAL_API_BASE_URL:-http://backend:3000/v1}
    networks:
      - healthdastaan-net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  healthdastaan-net:
    name: healthdastaan-net
    external: true
